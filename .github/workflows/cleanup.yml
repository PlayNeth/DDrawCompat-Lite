# One-time cleanup of broken/test releases and the CI test branch.
name: Cleanup

on:
  push:
    branches: [lite]
    paths: ['.github/workflows/cleanup.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete releases, tags and branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in v1.0.0 v1.0.1 v1.0.2-test1; do
            gh release delete "$t" --cleanup-tag --yes || echo "::warning::could not delete $t"
          done
          git push origin --delete ci-test || echo "::warning::could not delete ci-test"
