name: One-time cleanup

on:
  push:
    branches: [lite]
    paths: ['.github/workflows/cleanup.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Delete 1.1.0 beta and diagnostic releases and tags
        run: |
          for tag in $(gh release list -R "$REPO" -L 100 --json tagName -q '.[].tagName' | grep -E '^v1\.1\.0-'); do
            echo "Deleting $tag"
            gh release delete "$tag" -R "$REPO" --yes --cleanup-tag
          done
          for tag in $(gh api "repos/$REPO/tags?per_page=100" -q '.[].name' | grep -E '^v1\.1\.0-'); do
            echo "Deleting leftover tag $tag"
            gh api -X DELETE "repos/$REPO/git/refs/tags/$tag"
          done
      - name: Delete work branches
        run: |
          for branch in dev/1.1 dev/claw-diag dev/menu-diag ci-test; do
            gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" && echo "Deleted $branch" || echo "Skipped $branch"
          done
