name: One-time cleanup

on:
  push:
    branches: [lite]
    paths: ['.github/workflows/cleanup.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Delete 1.2.0 pre-releases and tags
        run: |
          for tag in $(gh release list -R "$REPO" -L 100 --json tagName -q '.[].tagName' | grep -E '^v1\.(1|2)\.0-'); do
            echo "Deleting $tag"
            gh release delete "$tag" -R "$REPO" --yes --cleanup-tag
          done
          for tag in $(gh api "repos/$REPO/tags?per_page=100" -q '.[].name' | grep -E '^v1\.(1|2)\.0-'); do
            gh api -X DELETE "repos/$REPO/git/refs/tags/$tag"
          done
      - name: Delete work branches
        run: |
          gh api -X DELETE "repos/$REPO/git/refs/heads/dev/1.2" && echo "Deleted dev/1.2" || echo "Skipped dev/1.2"
