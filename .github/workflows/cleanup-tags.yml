# One-time cleanup: removes the tags inherited from upstream DDrawCompat (v0.x).
name: Remove upstream tags

on:
  push:
    branches: [lite]
    paths: ['.github/workflows/cleanup-tags.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete v0.x tags
        run: |
          tags=$(git ls-remote --tags origin 'refs/tags/v0.*' | grep -v '\^{}' | awk '{print $2}' | sed 's#refs/tags/##')
          echo "Deleting: $tags"
          for t in $tags; do git push origin --delete "$t"; done
