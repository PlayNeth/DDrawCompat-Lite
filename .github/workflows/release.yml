name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      # DDrawCompat needs a few driver-kit headers that are not in the default user-mode include path.
      - name: Locate DDK headers
        shell: pwsh
        run: |
          $kits = 'C:\Program Files (x86)\Windows Kits\10\Include'
          $dir = Join-Path $env:RUNNER_TEMP 'ddk'
          New-Item -ItemType Directory -Force $dir | Out-Null
          foreach ($h in 'd3dumddi.h', 'd3dkmthk.h', 'd3dukmdt.h', 'd3dnthal.h', 'ddrawint.h') {
            $all = Get-ChildItem $kits -Recurse -Filter $h -ErrorAction SilentlyContinue | Sort-Object FullName -Descending
            $um = $all | Where-Object { $_.FullName -match '\\(um|shared)\\' } | Select-Object -First 1
            if ($um) { "found $h in $($um.FullName)"; continue }
            $km = $all | Select-Object -First 1
            if ($km) { Copy-Item $km.FullName $dir; "copied $h from $($km.FullName)" }
            else { "::warning::$h not found under $kits" }
          }
          "CL=/I`"$dir`"" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: |
          msbuild DDrawCompat.sln /m /nologo /v:minimal /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          Select-String -Path build.log -Pattern ': (fatal )?error ' | Select-Object -First 40 | ForEach-Object { "::error::" + $_.Line.Trim() }
          exit $code

      - name: Package
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter ddraw.dll | Where-Object { $_.FullName -match '\\Release\\' } | Select-Object -First 1
          if (-not $dll) { "::error::ddraw.dll not found"; exit 1 }
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item $dll.FullName pkg\
          Copy-Item DDrawCompat.ini, LICENSE.txt pkg\
          Compress-Archive pkg\* "DDrawCompat-Lite-$env:GITHUB_REF_NAME.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: DDrawCompat-Lite
          path: DDrawCompat-Lite-*.zip

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: DDrawCompat-Lite ${{ github.ref_name }}
          files: DDrawCompat-Lite-*.zip
          body: |
            Based on DDrawCompat v0.3.2, with new optional settings read from `DDrawCompat.ini`:
            AlternatePixelCenter, VSync, FpsLimiter, CpuSpeed, VideoMemory and SystemMemory.
            See the README and the sample `DDrawCompat.ini` for details. Without an ini file it behaves exactly like v0.3.2.

            Installation: copy `ddraw.dll` (and optionally `DDrawCompat.ini`) next to the game's .exe.
