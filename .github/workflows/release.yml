name: Build and release

# Bump the version in the VERSION file and push to the lite branch to publish a release.
on:
  push:
    branches: [lite, 'dev/**']
    paths: ['VERSION']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "TAG=v$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # Versions containing "debuglogs" are diagnostic builds that log every hooked call.
          $config = if ($version -match 'debuglogs') { 'ReleaseWithDebugLogs' } else { 'Release' }
          "CONFIG=$config" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: microsoft/setup-msbuild@v2

      # Match upstream's build environment: VS 2019 toolset (v142), Windows SDK 10.0.19041 and the
      # matching WDK 2004 headers (d3dumddi.h). The runner has no 19041 WDK, and newer DDK headers
      # change the driver interface structs DDrawCompat hooks.
      - name: Install WDK 2004 (10.0.19041)
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2128854' -OutFile "$env:RUNNER_TEMP\wdksetup.exe"
          $p = Start-Process "$env:RUNNER_TEMP\wdksetup.exe" -ArgumentList '/q', '/norestart', '/features', '+' -Wait -PassThru
          if ($p.ExitCode -ne 0) { "::error::WDK setup failed with exit code $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path 'C:\Program Files (x86)\Windows Kits\10\Include\10.0.19041.0\um\d3dumddi.h')) {
            "::error::d3dumddi.h for SDK 10.0.19041.0 not found after WDK setup"; exit 1
          }

      - name: Build
        shell: pwsh
        run: |
          msbuild DDrawCompat.sln /m /nologo /v:minimal /p:Configuration=$env:CONFIG /p:Platform=x86 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          Select-String -Path build.log -Pattern ': (fatal )?error ' | Select-Object -First 40 | ForEach-Object { "::error::" + $_.Line.Trim() }
          exit $code

      - name: Package
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter ddraw.dll | Where-Object { $_.FullName -match "\\$env:CONFIG\\" } | Select-Object -First 1
          if (-not $dll) { "::error::ddraw.dll not found"; exit 1 }
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item $dll.FullName pkg\
          Copy-Item DDrawCompat.ini, LICENSE.txt pkg\
          Compress-Archive pkg\* "DDrawCompat-Lite-$env:TAG.zip"

      - name: Release notes
        shell: pwsh
        run: |
          $notes = @(
            'Lightweight DDrawCompat based on v0.3.2 (with the Windows 11 24H2 fix), configurable through an'
            'optional `DDrawCompat.ini`. See the README and the sample `DDrawCompat.ini` for all settings and defaults.'
            ''
            'Installation: copy `ddraw.dll` (and optionally `DDrawCompat.ini`) next to the game''s .exe.'
          )
          $file = ".github/release-notes/$env:TAG.md"
          if (Test-Path $file) { $notes += ''; $notes += Get-Content $file }
          $notes | Out-File -Encoding utf8 notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: DDrawCompat-Lite
          path: DDrawCompat-Lite-*.zip

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: DDrawCompat-Lite ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-') }}
          files: DDrawCompat-Lite-*.zip
          body_path: notes.md
