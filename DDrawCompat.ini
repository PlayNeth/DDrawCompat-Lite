# ddrawcompat-lite configuration
#
# Place this file next to ddraw.dll and/or next to the game's .exe.
# Both are read if they are in different folders; the one next to the .exe wins.
# Keys and values are case-insensitive. Lines starting with # or ; are comments.
# Every setting is optional: the values below are the defaults.

# Log file (DDrawCompat-<game>.log, next to the game's .exe).
#   off | on | verbose
# verbose also records display mode and surface creation details, Direct3D devices,
# emulated palettized textures and a frame rate summary at exit.
Logging = off

# Frame rate overlay in the top-left corner: current FPS, average, 1% and 0.1% lows
# (over the last 10 seconds). Shown in fullscreen modes.
#   off | on
FpsCounter = off

# Emulates 8-bit palettized textures, which modern drivers no longer support.
# Only affects games that use them. Turn it off if a game misbehaves with it.
#   on | off
PalettizedTextures = on

# Shifts pre-transformed (XYZRHW) vertices to fix half-pixel offset artifacts
# (blurry 2D, seams between tiles, misaligned HUD). Points and lines are not shifted.
#   off | on (= -0.5 pixel) | custom(N) (= N/100 pixel, -100..100)
AlternatePixelCenter = off

# Vertical sync for Flip.
#   app    = honor the game's flip flags
#   off    = never block the game on vblank (display still updates without tearing)
#   on(N)  = always wait N vblanks per flip (1..16); "on" = on(1)
VSync = app

# Frame rate cap, applied on primary surface flips.
#   off | flipstart(N) | flipend(N)   N = max FPS (10..1000)
# flipstart waits before the flip is shown, flipend waits after it.
FpsLimiter = off

# CPU cores the game may run on. Old games often have threading bugs on multi-core CPUs,
# so the default keeps them on the first core, as DDrawCompat always has.
#   app (leave unchanged) | all | list of core numbers, e.g. 1 or 1,2
CpuAffinity = 1

# Hardware values reported to the game. The defaults are what a DirectX 7 era game expects,
# and small enough to avoid the overflows many of them hit on modern hardware.
# Use "app" to report the real values.

# CPU speed in MHz (registry ~MHz value). Does not slow the game down.
#   app | N
CpuSpeed = 2000

# Video memory in MB (DirectDraw GetCaps / GetAvailableVidMem), up to 4095.
#   app | N
VideoMemory = 256

# Physical memory in MB (GlobalMemoryStatus / GlobalMemoryStatusEx), up to 4095.
#   app | N
SystemMemory = 1024
